{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Every sign-in, view and download is recorded.</p>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <label>Username <input name="username" value="{{ username }}" required autofocus maxlength="64" autocomplete="username"></label>
    <label>Password <input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
