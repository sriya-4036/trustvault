{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% for e in errors %}<div class="flash flash-error">{{ e }}</div>{% endfor %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password <input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>New password <input type="password" name="new_password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <label>Confirm new password <input type="password" name="confirm_password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <p class="muted">At least 12 characters and not containing your username. Changing it signs out your other sessions.</p>
    <button type="submit" class="primary">Change password</button>
  </form>
</section>
{% endblock %}
